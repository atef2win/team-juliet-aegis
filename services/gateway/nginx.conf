events {}
http {
  server {
    listen 8090;

    location /detect { proxy_pass http://detect:8001; }
    location /seal   { proxy_pass http://seal:8002; }
    location /anchor { proxy_pass http://anchor:8003; }
    location /verify { proxy_pass http://verify:8004; }
    location /       { default_type text/plain; return 200 "AEGIS gateway OK\n"; }
  }
}
